name: Publish

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --workspace

      # Publish in dependency order: the main crate depends on the proc macro.
      # Bump both crates' versions for each release, or publishing an
      # unchanged proc macro version will fail.
      - name: Publish colorize-proc-macro
        run: cargo publish -p colorize-proc-macro
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}

      - name: Publish colorize-macros
        run: cargo publish -p colorize-macros
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
